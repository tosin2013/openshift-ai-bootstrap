---
# Provision tasks for ocp4_workload_rhoai

# ── 0. Preflight checks ──────────────────────────────────────────────────────
- name: Assert Red Hat registry credentials are set
  ansible.builtin.assert:
    that:
      - ocp4_workload_rhoai_registry_username | length > 0
      - ocp4_workload_rhoai_registry_password | length > 0
    fail_msg: >-
      ocp4_workload_rhoai_registry_username and ocp4_workload_rhoai_registry_password
      must be set. Supply them via agnosticd-v2-secrets/secrets.yml —
      never hard-code credentials in vars files.

# ── 1. Install Helm v4 on the bastion ───────────────────────────────────────
- name: Create temp directory for Helm download
  ansible.builtin.tempfile:
    state: directory
    suffix: helm
  register: ocp4_workload_rhoai_helm_tmp

- name: Download Helm v4 archive
  ansible.builtin.get_url:
    url: "{{ ocp4_workload_rhoai_helm_url }}"
    dest: "{{ ocp4_workload_rhoai_helm_tmp.path }}/helm.tar.gz"
    mode: "0644"

- name: Extract Helm binary
  ansible.builtin.unarchive:
    src: "{{ ocp4_workload_rhoai_helm_tmp.path }}/helm.tar.gz"
    dest: "{{ ocp4_workload_rhoai_helm_tmp.path }}"
    remote_src: true

- name: Install helm binary to /usr/local/bin
  ansible.builtin.copy:
    src: "{{ ocp4_workload_rhoai_helm_tmp.path }}/linux-amd64/helm"
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true
  become: true

- name: Verify Helm version
  ansible.builtin.command: helm version --short
  register: ocp4_workload_rhoai_helm_version_result
  changed_when: false

- name: Display Helm version
  ansible.builtin.debug:
    msg: "Helm installed: {{ ocp4_workload_rhoai_helm_version_result.stdout }}"

# ── 2. Create operator namespace and Red Hat registry pull secret ────────────
- name: Create RHOAI operator namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_rhoai_operator_namespace }}"

- name: Create Red Hat registry pull secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: rhoai-pull-secret
        namespace: "{{ ocp4_workload_rhoai_operator_namespace }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ ocp4_workload_rhoai_pull_secret_b64 | default(pull_secret | b64encode) }}"
  when: pull_secret is defined or ocp4_workload_rhoai_pull_secret_b64 is defined

# ── 3. Wait for Argo CD (deployed by ocp4_workload_openshift_gitops) ────────
- name: Wait for Argo CD to be available
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: ArgoCD
    namespace: "{{ ocp4_workload_rhoai_argocd_namespace }}"
  register: ocp4_workload_rhoai_argocd
  until: ocp4_workload_rhoai_argocd.resources | length > 0
  retries: 20
  delay: 30

# ── 4. Register Red Hat OCI registry with Argo CD ───────────────────────────
- name: Create Argo CD OCI registry secret for Red Hat registry
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: rhoai-chart-registry
        namespace: "{{ ocp4_workload_rhoai_argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        url: "registry.redhat.io/rhai"
        type: helm
        name: rhoai-chart-registry
        username: "{{ ocp4_workload_rhoai_registry_username | default(registry_username | default('')) }}"
        password: "{{ ocp4_workload_rhoai_registry_password | default(registry_password | default('')) }}"

# ── 3b. Create GPU MachineSet for GCP (cloud_provider == gcp only) ──────────
# ocp4_workload_machinesets has no GCP implementation (machineset-gcp.yml missing).
# Extract cluster facts from an existing worker MachineSet and create the GPU set directly.
- name: Get existing worker MachineSet facts (GCP)
  kubernetes.core.k8s_info:
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    namespace: openshift-machine-api
  register: ocp4_workload_rhoai_gcp_machinesets
  when:
    - cloud_provider | default('aws') == 'gcp'
    - ocp4_workload_rhoai_gpu_enabled | bool

- name: Extract GCP cluster facts from worker MachineSet
  ansible.builtin.set_fact:
    ocp4_workload_rhoai_gcp_project: >-
      {{ ocp4_workload_rhoai_gcp_machinesets.resources
         | selectattr('spec.template.spec.providerSpec.value.projectID', 'defined')
         | map(attribute='spec.template.spec.providerSpec.value.projectID') | first }}
    ocp4_workload_rhoai_gcp_network: >-
      {{ ocp4_workload_rhoai_gcp_machinesets.resources
         | selectattr('spec.template.spec.providerSpec.value.networkInterfaces', 'defined')
         | map(attribute='spec.template.spec.providerSpec.value.networkInterfaces')
         | map('first') | map(attribute='network') | first }}
    ocp4_workload_rhoai_gcp_subnetwork: >-
      {{ ocp4_workload_rhoai_gcp_machinesets.resources
         | selectattr('spec.template.spec.providerSpec.value.networkInterfaces', 'defined')
         | map(attribute='spec.template.spec.providerSpec.value.networkInterfaces')
         | map('first') | map(attribute='subnetwork') | first }}
    ocp4_workload_rhoai_gcp_cluster_id: >-
      {{ ocp4_workload_rhoai_gcp_machinesets.resources
         | selectattr('metadata.name', 'search', '-worker-')
         | map(attribute='metadata.name') | first
         | regex_replace('-worker-.*$', '') }}
    ocp4_workload_rhoai_gcp_coreos_image: >-
      {{ ocp4_workload_rhoai_gcp_machinesets.resources
         | selectattr('spec.template.spec.providerSpec.value.disks', 'defined')
         | map(attribute='spec.template.spec.providerSpec.value.disks')
         | map('first') | map(attribute='image') | first }}
    ocp4_workload_rhoai_gcp_service_account: >-
      {{ ocp4_workload_rhoai_gcp_machinesets.resources
         | selectattr('metadata.name', 'search', '-worker-')
         | selectattr('spec.template.spec.providerSpec.value.serviceAccounts', 'defined')
         | map(attribute='spec.template.spec.providerSpec.value.serviceAccounts')
         | map('first') | map(attribute='email') | first }}
  when:
    - cloud_provider | default('aws') == 'gcp'
    - ocp4_workload_rhoai_gpu_enabled | bool
    - ocp4_workload_rhoai_gcp_machinesets.resources | length > 0

- name: Create GCP GPU MachineSet (n1-standard-4 + T4 or g2-standard-4 L4)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: machine.openshift.io/v1beta1
      kind: MachineSet
      metadata:
        name: "{{ ocp4_workload_rhoai_gcp_cluster_id }}-gpu-t4-{{ ocp4_workload_rhoai_gcp_gpu_zone }}"
        namespace: openshift-machine-api
        labels:
          machine.openshift.io/cluster-api-cluster: "{{ ocp4_workload_rhoai_gcp_cluster_id }}"
      spec:
        replicas: "{{ ocp4_workload_rhoai_gcp_gpu_replicas }}"
        selector:
          matchLabels:
            machine.openshift.io/cluster-api-cluster: "{{ ocp4_workload_rhoai_gcp_cluster_id }}"
            machine.openshift.io/cluster-api-machineset: "{{ ocp4_workload_rhoai_gcp_cluster_id }}-gpu-t4-{{ ocp4_workload_rhoai_gcp_gpu_zone }}"
        template:
          metadata:
            labels:
              machine.openshift.io/cluster-api-cluster: "{{ ocp4_workload_rhoai_gcp_cluster_id }}"
              machine.openshift.io/cluster-api-machine-role: worker
              machine.openshift.io/cluster-api-machine-type: worker
              machine.openshift.io/cluster-api-machineset: "{{ ocp4_workload_rhoai_gcp_cluster_id }}-gpu-t4-{{ ocp4_workload_rhoai_gcp_gpu_zone }}"
          spec:
            taints:
              - key: nvidia.com/gpu
                value: "true"
                effect: NoSchedule
            providerSpec:
              value:
                apiVersion: machine.openshift.io/v1beta1
                kind: GCPMachineProviderSpec
                machineType: "{{ ocp4_workload_rhoai_gcp_gpu_machine_type }}"
                onHostMaintenance: Terminate
                restartPolicy: Always
                region: "{{ gcp_region | default('us-east1') }}"
                zone: "{{ ocp4_workload_rhoai_gcp_gpu_zone }}"
                projectID: "{{ ocp4_workload_rhoai_gcp_project }}"
                networkInterfaces:
                  - network: "{{ ocp4_workload_rhoai_gcp_network }}"
                    subnetwork: "{{ ocp4_workload_rhoai_gcp_subnetwork }}"
                disks:
                  - autoDelete: true
                    boot: true
                    image: "{{ ocp4_workload_rhoai_gcp_coreos_image }}"
                    sizeGb: "{{ ocp4_workload_rhoai_gcp_disk_size_gb }}"
                    type: pd-ssd
                serviceAccounts:
                  - email: "{{ ocp4_workload_rhoai_gcp_service_account }}"
                    scopes:
                      - https://www.googleapis.com/auth/cloud-platform
                credentialsSecret:
                  name: gcp-cloud-credentials
                guestAccelerators:
                  - acceleratorCount: "{{ ocp4_workload_rhoai_gcp_gpu_accelerator_count | default(1) }}"
                    acceleratorType: "{{ ocp4_workload_rhoai_gcp_accelerator_type | default('nvidia-tesla-t4') }}"
  when:
    - cloud_provider | default('aws') == 'gcp'
    - ocp4_workload_rhoai_gpu_enabled | bool
    - ocp4_workload_rhoai_gcp_cluster_id is defined

# ── 4b-wait. Wait for GPU-tainted node to join the cluster ──────────────────
# Must run AFTER MachineSet creation. The nvidia.com/gpu TAINT is applied at
# node creation time (by the MachineSet spec). NFD/GPU Operator add labels later.
- name: Wait for a node with nvidia.com/gpu taint to be Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: ocp4_workload_rhoai_all_nodes
  until: >-
    ocp4_workload_rhoai_all_nodes.resources
    | selectattr('spec.taints', 'defined')
    | selectattr('spec.taints', 'ne', None)
    | map(attribute='spec.taints')
    | flatten
    | selectattr('key', 'equalto', 'nvidia.com/gpu')
    | list | length > 0
  retries: 40
  delay: 30
  when: ocp4_workload_rhoai_gpu_enabled | bool

# ── 4c. Grant Argo CD cluster-admin for RHOAI cluster-scoped CRDs ───────────
# DataScienceCluster and DSCInitialization are cluster-scoped resources.
# The ArgoCD application-controller needs cluster-admin to create them.
- name: Grant Argo CD application-controller cluster-admin for RHOAI CRDs
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: openshift-gitops-rhoai-admin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: openshift-gitops-argocd-application-controller
          namespace: "{{ ocp4_workload_rhoai_argocd_namespace }}"

# ── 5. Create Argo CD Application CR for RHOAI chart ───────────────────────
- name: Create RHOAI Argo CD Application
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: rhoai
        namespace: "{{ ocp4_workload_rhoai_argocd_namespace }}"
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: default
        source:
          repoURL: "registry.redhat.io/rhai"
          chart: rhai-on-openshift-chart
          targetRevision: "{{ ocp4_workload_rhoai_chart_version }}"
          helm:
            releaseName: rhoai
            values: |
              skipCrdCheck: true
              profile: {{ ocp4_workload_rhoai_profile }}
              operator:
                type: {{ ocp4_workload_rhoai_operator_type }}
              dependencies:
                nfd:
                  enabled: {{ ocp4_workload_rhoai_nfd_enabled | lower }}
                nvidiaGPUOperator:
                  enabled: {{ ocp4_workload_rhoai_gpu_enabled | lower }}
              components:
                aipipelines:
                  dsc:
                    managementState: Removed
                dashboard:
                  dsc:
                    managementState: Managed
                ray:
                  dsc:
                    managementState: Removed
                kserve:
                  dsc:
                    managementState: Removed
                    wva:
                      managementState: Removed
                    nim:
                      managementState: Removed
                modelregistry:
                  dsc:
                    managementState: Removed
                workbenches:
                  dsc:
                    managementState: Managed
                kueue:
                  dsc:
                    managementState: Removed
                llamastackoperator:
                  dsc:
                    managementState: Removed
                trainingoperator:
                  dsc:
                    managementState: Removed
                feastoperator:
                  dsc:
                    managementState: Removed
                mlflowoperator:
                  dsc:
                    managementState: Removed
                trustyai:
                  dsc:
                    managementState: Removed
                trainer:
                  dsc:
                    managementState: Removed
        destination:
          server: https://kubernetes.default.svc
          namespace: "{{ ocp4_workload_rhoai_operator_namespace }}"
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - SkipDryRunOnMissingResource=true

# ── 5b. Create NFD and GPU Operator instances (if GPU enabled) ──────────────
# The RHOAI chart installs the OLM subscriptions but not the operand CRs.
# NFD needs NodeFeatureDiscovery to scan and label nodes.
# GPU Operator needs ClusterPolicy to deploy drivers and device plugin.
- name: Create NFD NodeFeatureDiscovery instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: nfd.openshift.io/v1
      kind: NodeFeatureDiscovery
      metadata:
        name: nfd-instance
        namespace: openshift-nfd
      spec:
        operand:
          servicePort: 12000
        workerConfig:
          configData: |
            core:
              sleepInterval: 60s
            sources:
              pci:
                deviceClassWhitelist:
                  - "0200"
                  - "03"
                  - "12"
              custom: []
  when: ocp4_workload_rhoai_nfd_enabled | bool

- name: Create GPU Operator ClusterPolicy
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: nvidia.com/v1
      kind: ClusterPolicy
      metadata:
        name: gpu-cluster-policy
      spec:
        operator:
          defaultRuntime: crio
        daemonsets:
          priorityClassName: system-node-critical
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
        devicePlugin:
          enabled: true
          config:
            name: ""
        driver:
          enabled: true
          rdma:
            enabled: false
        dcgm:
          enabled: true
        dcgmExporter:
          enabled: true
        gfd:
          enabled: true
        migManager:
          enabled: true
        nodeStatusExporter:
          enabled: true
        toolkit:
          enabled: true
        validator:
          plugin:
            env:
              - name: WITH_WORKLOAD
                value: "false"
  when: ocp4_workload_rhoai_gpu_enabled | bool

# ── 6. Wait for DataScienceCluster to reach Ready ───────────────────────────
# Wait for the RHOAI operator CSV to be Succeeded before polling DSC.
# Argo CD uses two-phase sync: phase 1 creates OLM subscription, phase 2 (selfHeal)
# creates DataScienceCluster + DSCInitialization once CRDs register. This wait
# ensures the operator is ready before we poll for the DSC.
- name: Wait for RHOAI operator CSV to be Succeeded
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ ocp4_workload_rhoai_operator_namespace }}"
  register: ocp4_workload_rhoai_csv
  until:
    - ocp4_workload_rhoai_csv.resources | length > 0
    - ocp4_workload_rhoai_csv.resources | selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 40
  delay: 30
  when: not ansible_check_mode

- name: Wait for DataScienceCluster to reach Ready
  kubernetes.core.k8s_info:
    api_version: datasciencecluster.opendatahub.io/v1
    kind: DataScienceCluster
  register: ocp4_workload_rhoai_dsc
  until:
    - ocp4_workload_rhoai_dsc.resources | length > 0
    - ocp4_workload_rhoai_dsc.resources[0].status.conditions is defined
    - >-
      ocp4_workload_rhoai_dsc.resources[0].status.conditions |
      selectattr('type', 'equalto', 'Ready') |
      selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 60
  delay: 30

# ── 7. Get RHOAI dashboard URL ───────────────────────────────────────────────
- name: Get RHOAI dashboard route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: rhods-dashboard
    namespace: redhat-ods-applications
  register: ocp4_workload_rhoai_dashboard_route
  retries: 10
  delay: 30
  until: ocp4_workload_rhoai_dashboard_route.resources | length > 0

- name: Set dashboard URL fact
  ansible.builtin.set_fact:
    ocp4_workload_rhoai_dashboard_url: >-
      https://{{ ocp4_workload_rhoai_dashboard_route.resources[0].spec.host }}

# ── 8. Emit agnosticd_user_info ──────────────────────────────────────────────
- name: Print RHOAI access info
  agnosticd.core.agnosticd_user_info:
    msg: |
      Red Hat OpenShift AI (RHOAI) is installed and ready.

      Dashboard URL: {{ ocp4_workload_rhoai_dashboard_url }}

      Profile: {{ ocp4_workload_rhoai_profile }}
      GPU support: {{ ocp4_workload_rhoai_gpu_enabled }}

      Log in with your OpenShift credentials.
