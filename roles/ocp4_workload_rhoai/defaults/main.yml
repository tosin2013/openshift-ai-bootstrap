---
# ocp4_workload_rhoai default variables

# RHOAI Helm chart version (aligns to RHOAI release)
ocp4_workload_rhoai_chart_version: "v3.4"

# Operator type: rhoai (Red Hat OpenShift AI) or odh (Open Data Hub community)
ocp4_workload_rhoai_operator_type: "rhoai"

# RHOAI installation profile: default (base) or rhaii (distributed inference + llm-d)
ocp4_workload_rhoai_profile: "default"

# OCI registry for the chart
ocp4_workload_rhoai_chart_registry: "oci://registry.redhat.io/rhai/rhai-on-openshift-chart"

# Enable NFD (Node Feature Discovery) — required for GPU support
ocp4_workload_rhoai_nfd_enabled: true

# Enable NVIDIA GPU Operator
ocp4_workload_rhoai_gpu_enabled: false

# GitOps source repo (odh-gitops) for Argo CD values
ocp4_workload_rhoai_gitops_repo: "https://github.com/opendatahub-io/odh-gitops"
ocp4_workload_rhoai_gitops_branch: "rhoai-devtest"
ocp4_workload_rhoai_gitops_values_path: "charts/rhai-on-openshift-chart/values.yaml"

# Namespaces
ocp4_workload_rhoai_operator_namespace: "redhat-ods-operator"
ocp4_workload_rhoai_argocd_namespace: "openshift-gitops"

# Helm v4 download URL and checksum (linux_amd64)
ocp4_workload_rhoai_helm_version: "4.0.3"
ocp4_workload_rhoai_helm_url: >-
  https://get.helm.sh/helm-v{{ ocp4_workload_rhoai_helm_version }}-linux-amd64.tar.gz
