---
# RHOAI deployment on AWS — OCP 4.22 with GPU nodes
# Cloud provider
cloud_provider: aws
cloud_provider_version: main
config: openshift-cluster
aws_region: us-east-2

# OpenShift version
host_ocp4_installer_version: "4.22"

# Pull core_workloads collection (ocp4_workload_cert_manager, machinesets, openshift_gitops, etc.)
agnosticd_dynamic_role_git_sources:
  - repo: https://github.com/rhpds/core_workloads.git
    version: main

# Workloads applied after cluster provisioning
workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_machinesets
  - ocp4_workload_openshift_gitops
  - ocp4_workload_rhoai

# cert-manager channel — available on OCP 4.22: stable-v1, stable-v1.19, stable-v1.20
ocp4_workload_cert_manager_channel: stable-v1

# Disable ingress/API cert issuance — requires Route53 credentials we don't have.
# cert-manager is installed for RHOAI's internal use only.
ocp4_workload_cert_manager_install_ingress_certificates: false
ocp4_workload_cert_manager_install_api_certificates: false

# GPU node pool — g4dn.xlarge (1× NVIDIA T4)
# Disable machineset's built-in node wait — it fails instantly when the node already
# exists (the wait condition checks MachineSet status, not actual node Ready state).
# ocp4_workload_rhoai has its own GPU taint readiness gate that correctly verifies
# the node is Ready before proceeding with RHOAI chart deployment.
ocp4_workload_machinesets_wait_for_nodes: false

ocp4_workload_machinesets_machineset_groups:
  - name: gpu
    instance_type: g4dn.xlarge
    total_replicas: 1
    total_replicas_min: 1
    total_replicas_max: 1
    labels:
      nvidia.com/gpu: "true"
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule

# RHOAI workload settings
ocp4_workload_rhoai_chart_version: "v3.4"
ocp4_workload_rhoai_operator_type: "rhoai"
ocp4_workload_rhoai_profile: "default"
ocp4_workload_rhoai_nfd_enabled: true
ocp4_workload_rhoai_gpu_enabled: true
ocp4_workload_rhoai_gitops_branch: "rhoai-devtest"

# Cluster sizing (3 worker nodes minimum for RHOAI)
worker_instance_type: m6i.4xlarge
worker_instance_count: 3

# Disable Satellite registration — sandbox accounts don't have Satellite credentials
install_satellite_repositories: false

# Override bastion AMI to RHEL 10 marketplace/RHUI image (Hourly2 = RHUI pre-configured).
# GOLD AMI (Access2) requires RHSM registration which sandbox accounts don't have.
# agnosticd_images must be a dict with name + image_id keys to match the lookup return format.
agnosticd_images:
  bastion:
    name: "RHEL-10.2.0_HVM-20261020-x86_64-0-Hourly2-GP3"
    image_id: "ami-05e4fe0cb43c83113"
    platform_details: "Red Hat Enterprise Linux"
    architecture: "x86_64"
    description: "Provided by Red Hat, Inc."

# Required for RHDP automated cleanup — missing tags orphan resources
cloud_tags:
  owner: "{{ email | default('unknown') }}"
  config: openshift-cluster
  guid: "{{ guid }}"
  env_type: openshift-cluster
