---
# RHOAI deployment on GCP — OCP 4.22 with GPU nodes
# NOTE: ocp4_workload_machinesets has no GCP implementation (machineset-gcp.yml
# does not exist in core_workloads). GPU MachineSet is created by the
# ocp4_workload_rhoai role using kubernetes.core.k8s directly.
# NOTE: T4 on n1 instances is deprecated (EOL Aug 2027). Using g2-standard-4
# (NVIDIA L4, 24GB VRAM, ~$0.70/hr) — better value and no accelerator attachment needed.
cloud_provider: gcp
cloud_provider_version: main
cloud_provider_repo: https://github.com/tosin2013/cloud_provider_gcp.git
config: openshift-cluster
gcp_region: us-east1

host_ocp4_installer_version: "4.22"

# ocp4_workload_machinesets removed — no GCP implementation in core_workloads.
# GPU MachineSet created by ocp4_workload_rhoai (kubernetes.core.k8s task).
workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_gitops
  - ocp4_workload_rhoai
  - ocp4_workload_validate_rhoai

# GPU node pool — g2-standard-4 (1× NVIDIA L4, 24GB VRAM)
# Purpose-built GPU machine type — no guest_accelerators stanza needed.
ocp4_workload_rhoai_gcp_gpu_machine_type: "g2-standard-4"
ocp4_workload_rhoai_gcp_gpu_replicas: 1
ocp4_workload_rhoai_gcp_gpu_zone: "us-east1-b"

# GCP Open Environment credentials
gcp_project_id: openenv-txdmd
gcp_credentials_file: /secrets/gcp-service-account.json
ocp4_workload_rhoai_gcp_disk_size_gb: 128

ocp4_workload_rhoai_chart_version: "v3.4"
ocp4_workload_rhoai_operator_type: "rhoai"
ocp4_workload_rhoai_profile: "default"
ocp4_workload_rhoai_nfd_enabled: true
ocp4_workload_rhoai_gpu_enabled: true
ocp4_workload_rhoai_gitops_branch: "rhoai-devtest"

worker_instance_type: n2-standard-4
worker_instance_count: 3

# Validation role settings — g2-standard-4 (NVIDIA L4, 24GB VRAM)
ocp4_workload_validate_rhoai_gpu_instance_type: "g2-standard-4"
ocp4_workload_validate_rhoai_gpu_vendor_pci_id: "10de"  # NVIDIA
ocp4_workload_validate_rhoai_gpu_min_count: 1
