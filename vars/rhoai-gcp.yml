---
# RHOAI deployment on GCP — OCP 4.22 with GPU nodes
# NOTE: ocp4_workload_machinesets has no GCP implementation (machineset-gcp.yml
# does not exist in core_workloads). GPU MachineSet is created by the
# ocp4_workload_rhoai role using kubernetes.core.k8s directly.
# NOTE: T4 on n1 instances is deprecated (EOL Aug 2027). Using g2-standard-4
# (NVIDIA L4, 24GB VRAM, ~$0.70/hr) — better value and no accelerator attachment needed.
cloud_provider: gcp
cloud_provider_version: main
cloud_provider_repo: https://github.com/tosin2013/cloud_provider_gcp.git
config: openshift-cluster
gcp_region: us-east1

host_ocp4_installer_version: "4.22"

# ocp4_workload_machinesets removed — no GCP implementation in core_workloads.
# GPU MachineSet created by ocp4_workload_rhoai (kubernetes.core.k8s task).
workloads:
  - ocp4_workload_cert_manager
  - ocp4_workload_openshift_gitops
  - ocp4_workload_rhoai
  - ocp4_workload_validate_rhoai

# GPU node pool — n1-standard-4 + T4 (1× NVIDIA T4, 16GB VRAM)
# g2-standard-4 (L4) is STOCKOUT in all us-east1 zones. Using n1+T4 instead.
# T4 is deprecated (EOL Aug 2027) but widely available; switch to L4 when capacity allows.
ocp4_workload_rhoai_gcp_gpu_machine_type: "n1-standard-4"
ocp4_workload_rhoai_gcp_gpu_accelerator_type: "nvidia-tesla-t4"
ocp4_workload_rhoai_gcp_gpu_accelerator_count: 1
ocp4_workload_rhoai_gcp_gpu_replicas: 1
ocp4_workload_rhoai_gcp_gpu_zone: "us-east1-b"

# GCP Open Environment credentials
gcp_project_id: openenv-txdmd
gcp_credentials_file: /secrets/gcp-service-account.json
ocp4_workload_rhoai_gcp_disk_size_gb: 128

ocp4_workload_rhoai_chart_version: "v3.4"
ocp4_workload_rhoai_operator_type: "rhoai"
ocp4_workload_rhoai_profile: "default"
ocp4_workload_rhoai_nfd_enabled: true
ocp4_workload_rhoai_gpu_enabled: true
ocp4_workload_rhoai_gitops_branch: "rhoai-devtest"

worker_instance_type: n2-standard-4
worker_instance_count: 5

# Validation role settings — g2-standard-4 (NVIDIA L4, 24GB VRAM)
ocp4_workload_validate_rhoai_gpu_instance_type: "g2-standard-4"
ocp4_workload_validate_rhoai_gpu_vendor_pci_id: "10de"  # NVIDIA
ocp4_workload_validate_rhoai_gpu_min_count: 1

# Override bastion instance to set ansible_group=bastions (plural)
# Default is item.name='bastion' (singular) which breaks create_inventory
# group detection (looks for groups.bastions not groups.bastion)
instances:
  - name: bastion
    count: 1
    unique: true
    public_ip: true
    image_family: rhel-9
    instance_type: "{{ bastion_instance_type | default('n2-standard-4') }}"
    rootfs_size: "{{ bastion_rootfs_size | default(50) }}"
    ansible_group: bastions
    tags:
      - bastion

base_domain: txdmd.gcp.redhatworkshops.io

# Disable Satellite — sandbox accounts don't have Satellite credentials (same as AWS)
install_satellite_repositories: false

# Skip common packages on bastion — RHEL 9 uses RHUI which should work
# but disable as safety measure like AWS
install_common_packages: false

# cert-manager channel — same fix as AWS (stable-v1.15 does not exist on OCP 4.22)
ocp4_workload_cert_manager_channel: stable-v1
ocp4_workload_cert_manager_install_ingress_certificates: false
ocp4_workload_cert_manager_install_api_certificates: false
# cert-manager GCP DNS01 solver credentials — the role reads gcp_credentials (JSON dict)
# even when no certificates are requested, to configure the solver.
# The EE mounts ~/agnosticd-v2-secrets/ as /secrets/ so this lookup resolves inside the EE.
gcp_credentials: "{{ lookup('file', '/secrets/gcp-service-account.json') | from_json }}"
