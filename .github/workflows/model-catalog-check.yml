name: Model Catalog Check

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  check-new-models:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch new Granite models from HuggingFace Hub
        id: granite
        run: |
          # Query ibm-granite org — most recent 20 models by lastModified
          GRANITE=$(curl -sf \
            "https://huggingface.co/api/models?author=ibm-granite&sort=lastModified&limit=20" \
            | jq -r '.[].modelId' 2>/dev/null || echo "")
          echo "granite_models<<EOF" >> "$GITHUB_OUTPUT"
          echo "$GRANITE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Fetch new Meta-Llama / Muse models from HuggingFace Hub
        id: llama
        run: |
          # meta-llama org covers both Llama and Muse families
          LLAMA=$(curl -sf \
            "https://huggingface.co/api/models?author=meta-llama&sort=lastModified&limit=30" \
            | jq -r '.[].modelId' 2>/dev/null || echo "")
          echo "llama_models<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LLAMA" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Fetch new Mistral models from HuggingFace Hub
        id: mistral
        run: |
          MISTRAL=$(curl -sf \
            "https://huggingface.co/api/models?author=mistralai&sort=lastModified&limit=20" \
            | jq -r '.[].modelId' 2>/dev/null || echo "")
          echo "mistral_models<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MISTRAL" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Fetch new Qwen models from HuggingFace Hub
        id: qwen
        run: |
          QWEN=$(curl -sf \
            "https://huggingface.co/api/models?author=Qwen&sort=lastModified&limit=30" \
            | jq -r '.[].modelId' 2>/dev/null || echo "")
          echo "qwen_models<<EOF" >> "$GITHUB_OUTPUT"
          echo "$QWEN" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Fetch new NVIDIA Nemotron models from HuggingFace Hub
        id: nvidia
        run: |
          NVIDIA=$(curl -sf \
            "https://huggingface.co/api/models?author=nvidia&sort=lastModified&limit=30" \
            | jq -r '.[].modelId' 2>/dev/null | grep -i "nemotron\|llama-nemotron" || echo "")
          echo "nvidia_models<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NVIDIA" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check for new models not in gpu-sizing.md
        id: diff
        run: |
          SIZING_DOC="docs/gpu-sizing.md"
          NEW_MODELS=""

          check_model() {
            local model_id="$1"
            local short_name
            short_name=$(echo "$model_id" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
            if ! grep -qi "$short_name" "$SIZING_DOC"; then
              NEW_MODELS="${NEW_MODELS}\n- [${model_id}](https://huggingface.co/${model_id})"
            fi
          }

          while IFS= read -r model; do
            [ -n "$model" ] && check_model "$model"
          done <<< "${{ steps.granite.outputs.granite_models }}"

          while IFS= read -r model; do
            [ -n "$model" ] && check_model "$model"
          done <<< "${{ steps.llama.outputs.llama_models }}"

          while IFS= read -r model; do
            [ -n "$model" ] && check_model "$model"
          done <<< "${{ steps.mistral.outputs.mistral_models }}"

          while IFS= read -r model; do
            [ -n "$model" ] && check_model "$model"
          done <<< "${{ steps.qwen.outputs.qwen_models }}"

          while IFS= read -r model; do
            [ -n "$model" ] && check_model "$model"
          done <<< "${{ steps.nvidia.outputs.nvidia_models }}"

          if [ -n "$NEW_MODELS" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "new_models<<EOF" >> "$GITHUB_OUTPUT"
            printf "%b" "$NEW_MODELS" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open GitHub issue for new models
        if: steps.diff.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## New models detected on HuggingFace Hub

The weekly model catalog check found models that are not yet listed in \`docs/gpu-sizing.md\`.

**New models (Granite / Llama / Muse / Mistral / Qwen / Nemotron families):**
${{ steps.diff.outputs.new_models }}

### Next steps

1. Review each model's VRAM requirements and architecture
2. Add appropriate entries to the **Recommended Models per GPU Tier** table in \`docs/gpu-sizing.md\`
3. Close this issue when the table is updated

> Generated by [model-catalog-check workflow](.github/workflows/model-catalog-check.yml) on $(date -u +%Y-%m-%d)"

          # Check if an open issue already exists for this week
          EXISTING=$(gh issue list \
            --label "model-catalog" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Open model-catalog issue #${EXISTING} already exists — adding a comment"
            gh issue comment "$EXISTING" \
              --body "**Updated check $(date -u +%Y-%m-%d):**
${{ steps.diff.outputs.new_models }}"
          else
            gh issue create \
              --title "New models detected: gpu-sizing.md may need updating ($(date -u +%Y-%m-%d))" \
              --body "$BODY" \
              --label "model-catalog,documentation"
          fi
